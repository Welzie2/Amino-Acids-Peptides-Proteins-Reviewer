{n:"Proteins Overview",s:"Intro slides",d:"What proteins are, the 20 amino acids, types and essential amino acids.",i:[
["Proteins","Most abundant biological macromolecules, occurring in all cells and all parts of cells."],
["The 20 amino acids","All proteins are constructed from the same ubiquitous set of 20 amino acids. Cells produce proteins with strikingly different properties and activities by joining the same 20 amino acids in many different combinations and sequences."],
["Types of proteins","Structural: tendons, cartilage, hair, nails. Contractile: muscles. Transport: hemoglobin. Storage: milk. Hormonal: insulin, growth hormone. Enzyme: catalyzes reactions in cells. Protection: immune response."],
["Protein (definition)","A macromolecule composed of one or more polypeptides. All 20 amino acids are necessary for protein synthesis. Of all molecules in living organisms, proteins have the most diverse functions."],
["Essential amino acids","10 amino acids are not synthesized by the body and must be obtained from the diet: arg, his, ile, leu, lys, met, phe, thr, trp, val."]]},
{n:"Amino Acids",s:"Amino Acids / Standard Amino Acids",d:"Basic structure and the five classes.",i:[
["Amino acid","Building blocks of proteins. Has a carboxylic acid group, an amino group, and a side group R that gives unique characteristics (H2N–CH(R)–COOH)."],
["Standard amino acids","The 20 amino acids commonly found in protein. Knowledge of their chemical properties is central to understanding biochemistry."],
["Five classes","Grouped into 5 main classes by the properties of their R group, in particular polarity or tendency to interact with water at biological pH (near pH 7.0): nonpolar aliphatic; aromatic; polar uncharged; positively charged (basic); negatively charged (acidic)."]]},
{n:"R-Group Classes",s:"Nonpolar, Aromatic, Polar, Charged R Groups",d:"Members and properties of each class.",i:[
["Nonpolar, aliphatic R groups","Glycine, alanine, valine, leucine, methionine, isoleucine, proline. R groups are nonpolar and hydrophobic. Side chains of alanine, valine, leucine and isoleucine cluster together within proteins, stabilizing protein structure by hydrophobic interactions."],
["Glycine","Simplest structure. Its very small side chain makes no real contribution to hydrophobic interactions."],
["Methionine","Has a nonpolar thioether group in its side chain."],
["Proline","Aliphatic side chain with a distinctive cyclic structure."],
["Aromatic R groups","Phenylalanine, tyrosine, tryptophan: relatively nonpolar (hydrophobic); all can participate in hydrophobic interactions."],
["Tyrosine and tryptophan polarity","The hydroxyl group of tyrosine can form hydrogen bonds and is an important functional group in some enzymes. Tyrosine and tryptophan are significantly more polar than phenylalanine because of the tyrosine hydroxyl group and the nitrogen of the tryptophan indole ring."],
["Polar, uncharged R groups","Serine, threonine, cysteine, asparagine, glutamine. More soluble in water (more hydrophilic); contain functional groups that form hydrogen bonds with water. Serine and threonine: hydroxyl groups. Cysteine: sulfhydryl group. Asparagine and glutamine: amide groups."],
["Positively charged (basic) R groups","The most hydrophilic R groups are those positively or negatively charged. Significant positive charge at pH 7: lysine, arginine, histidine. Lysine: second primary amino group at the ε position on its aliphatic chain. Arginine: positively charged guanidino group. Histidine: imidazole group; the only common amino acid with an ionizable side chain with a pKa near neutrality."],
["Negatively charged (acidic) R groups","The 2 amino acids with R groups of net negative charge at pH 7.0 are aspartate and glutamate, each with a second carboxyl group."]]},
{n:"pKa and pI",s:"pKa / pI tables",d:"pKa values and isoelectric points.",i:[
["pKa1, pKa2, pKa3","pKa1 = α-carboxyl group, pKa2 = α-ammonium ion, pKa3 = side chain group."],
["pI (isoelectric pH)","The pH at which a solute has no electric charge and thus does not move in an electric field."]],
tb:{h:["Amino acid","pKa1","pKa2","pKa3","pI"],r:"Glycine 2.34 9.60 - 5.97;Alanine 2.34 9.69 - 6.01;Valine 2.32 9.62 - 5.97;Leucine 2.36 9.60 - 5.98;Isoleucine 2.36 9.68 - 6.02;Methionine 2.28 9.21 - 5.74;Proline 1.99 10.96 - 6.48;Phenylalanine 1.83 9.13 - 5.48;Tryptophan 2.38 9.39 - 5.89;Asparagine 2.02 8.80 - 5.41;Glutamine 2.17 9.13 - 5.65;Serine 2.21 9.15 - 5.68;Threonine 2.11 9.62 - 5.87;Tyrosine 2.20 9.11 10.07 5.66;Cysteine 1.96 10.28 8.18 5.07;Aspartic_acid 1.88 9.60 3.65 2.77;Glutamic_acid 2.19 9.67 4.25 3.22;Lysine 2.18 8.95 10.53 9.74;Arginine 2.17 9.04 12.48 10.76;Histidine 1.82 9.17 6.00 7.59"}},
{n:"Stereoisomers & Zwitterions",s:"Amino Acid Stereoisomers / Zwitterions",d:"Chirality, D/L forms, charge behavior vs pH.",i:[
["Asymmetric (chiral) carbon","A carbon atom with four different substituents. 19 of the 20 standard amino acids are asymmetric; glycine is symmetrical because its α-carbon is attached to 2 hydrogens."],
["Stereoisomers","Molecules with chiral carbons can exist as stereoisomers: molecules that differ only in the spatial arrangement of their atoms (mirror images are enantiomers)."],
["D and L forms","Designated D (dextrorotatory) or L (levorotatory) by the direction crystalline forms rotate polarized light, to the right and left respectively. Naturally-occurring proteins comprise exclusively the L forms of amino acids."],
["Zwitterion","An amino acid has both a basic amine group and an acidic carboxylic acid group. An internal transfer of a hydrogen ion from –COOH to –NH2 leaves an ion with both a negative and a positive charge: a zwitterion, a compound with no overall electrical charge but with separate positively and negatively charged parts (H3N+–CH(R)–COO−)."],
["Adding an alkali","Increasing pH by adding hydroxide ions removes the hydrogen ion from the –NH3+ group (NH3+ + OH− → NH2 + H2O). The result is a negative ion, no longer a zwitterion."],
["Adding an acid","Decreasing pH by adding acid makes the –COO− part of the zwitterion pick up a hydrogen ion. The result is a positive ion, no longer a zwitterion."]]},
{n:"Peptides",s:"Peptides and Proteins",d:"Peptide bond, classification, termini, naming.",i:[
["Peptide","2 or more amino acids covalently joined by peptide bond."],
["Peptide bond","A substituted amide linkage between the α-amino group of one amino acid and the α-carboxyl group of another, with the elimination of the elements of water."],
["Classification of peptides","By number of amino acid units. Dipeptide: 2 amino acids joined by a peptide bond. 3–10 amino acids: tripeptides, tetrapeptides, pentapeptides, and so on. Oligopeptides: more than ten but fewer than 20. Polypeptide: macromolecule with 20 or more amino acid units."],
["Residue","An amino acid unit in a peptide: the part left after losing a hydrogen atom from its amino group and the hydroxyl moiety from its carboxyl group."],
["N-terminal and C-terminal","Amino-terminal (N-terminal) residue: the end with a free α-amino group. Carboxyl-terminal (C-terminal) residue: the other end, with a free carboxyl group."],
["Amino acid sequence","The precise order of amino acids in the peptide. Peptides are named by sequence; by convention the higher-priority carboxyl group is to the right and the amino end to the left."],
["Naming peptides","Name from the free amine (NH3+); use -yl endings for the amino acids; the last amino acid with the free carboxyl (COO−) uses its amino acid name. Examples: Ala-Gly = alanylglycine (AG); Gly-Ala = glycylalanine (GA); Ser-Gly-Tyr-Ala-Leu = serylglycyltyrosylalanylleucine (SGYAL)."]]},
{n:"Functions of Protein",s:"Functions of Protein 1–8",d:"Eight functions with examples.",i:[
["1. Catalysis","Enzymes are proteins that direct and accelerate thousands of biochemical reactions in digestion, energy capture and biosynthesis."],
["2. Structure","Some proteins provide protection and support; often very specialized. Ex: collagen, fibroin, elastin."],
["3. Movement","Proteins are involved in all cell movements. Ex: actin, tubulin."],
["4. Defense","Keratin (skin cells) protects against mechanical and chemical injury. Fibrinogen and thrombin (blood clotting) prevent blood loss when vessels are damaged. Immunoglobulins (antibodies) are produced by lymphocytes when foreign organisms such as bacteria invade."],
["5. Regulation","Binding a hormone or growth factor to cognate receptors on its target cell changes cellular function. Peptide hormones: insulin and glucagon regulate blood glucose levels. Growth hormones stimulate cell growth and division. Growth factors are polypeptides controlling animal cell division and differentiation, ex: PDGF (platelet-derived growth factor), EGF (epidermal growth factor)."],
["6. Transport","Carriers of molecules and ions across membranes and between cells. Hemoglobin carries oxygen from lungs to tissues. Lipoproteins (LDL and HDL) transport lipids from liver and intestines to other organs. Transferrin and ceruloplasmin (serum proteins) transport iron and copper, respectively."],
["7. Storage","Reservoir of essential nutrients. Ovalbumin (bird eggs) and casein (mammalian milk) are rich sources of organic nitrogen during development. Zein (plant protein) does a similar role in germinating seed."],
["8. Stress response","Survival of abiotic stresses is mediated by certain proteins. Cytochrome P450: diverse group of enzymes in animals and plants that usually convert toxic organic contaminants into less toxic derivatives. Metallothionein: cysteine-rich intracellular protein in virtually all mammalian cells that binds and sequesters toxic metals such as cadmium, mercury and silver."]]},
{n:"Protein Classification",s:"Protein Classification",d:"By shape and by composition.",i:[
["Fibrous proteins","Polypeptide chains arranged side by side in long filaments; insoluble in water and physically tough; structural and protective functions."],
["Globular proteins","Coiled into compact, roughly spherical shapes; usually water soluble; dynamic functions. Most enzymes are globular."],
["Examples table","Fibrous (insoluble): collagens (animal hide, tendons, connective tissues); elastins (blood vessels, ligaments); fibrinogen (blood clotting); keratins (skin, wool, feathers, hooves, silk, fingernails); myosins (muscle tissue). Globular (soluble): hemoglobin (oxygen transport); immunoglobulins (immune response); insulin (hormone controlling glucose metabolism); ribonuclease (enzyme controlling RNA synthesis)."],
["Simple proteins","Yield only amino acids on hydrolysis."],
["Conjugated proteins","Much more common than simple proteins; yield other compounds (carbohydrates, fats, nucleic acids) plus amino acids on hydrolysis. A simple protein combined with a nonprotein component called a prosthetic group."],
["Apoprotein / holoprotein","Apoprotein: a protein without its prosthetic group. Holoprotein: a protein combined with its prosthetic group."],
["Conjugated types","Classified by prosthetic group: glycoproteins (carbohydrate); lipoproteins (lipid); metalloproteins (metal ions); phosphoproteins (phosphate groups); hemeproteins (heme groups)."]]},
{n:"Protein Structure",s:"Protein Structure",d:"Primary to quaternary structure.",i:[
["Primary structure","Simply the amino acid sequence (e.g. AGVGTVPMTAYGNDIQYYGQVT…)."],
["Secondary structure","How segments of the peptide backbone orient into a regular pattern. Regular hydrogen bonding gives two patterns in nearly every known protein: the α-helix and the β-sheet. The location/direction of these periodic repeating structures is the secondary structure."],
["α-helix","Rigid, rodlike structure formed when a polypeptide chain twists into a right-handed helical conformation. Hydrogen bonds form between the N-H of each amino acid and the carbonyl (C=O) of the amino acid four residues away. 3.6 residues per turn; R groups extend outward from the helix."],
["β-pleated sheet","Forms when two or more polypeptide segments line up side by side. Each segment is a β-strand, fully extended rather than coiled. Stabilized by hydrogen bonds between backbone N-H and carbonyl groups of adjacent chains."],
["Parallel vs antiparallel","Parallel: polypeptide chains arranged in the same direction. Antiparallel: run in opposite direction; more stable than parallel because fully colinear hydrogen bonds form."],
["Tertiary structure","How the entire protein molecule coils into an overall three-dimensional shape; secondary elements combine to form it. R group interactions: hydrogen bond, disulfide bond (covalent), hydrophobic interaction, electrostatic interaction."],
["Quaternary structure","How different protein molecules come together to yield large aggregate structures; formed by noncovalent association of tertiary structures."],
["Views of a protein","Wireframe, ball and stick, spacefill, cartoon."]]},
{n:"Denaturation",s:"Loss of Protein Structure",d:"Denaturing conditions.",i:[
["Denaturation","The process of structure disruption."],
["1. Strong acids or bases","Protonation of some side groups alters hydrogen bonding and salt bridge (electrostatic) patterns."],
["2. Organic solvents","Interfere with hydrophobic interactions."],
["3. Detergents","Disrupt hydrophobic interactions."],
["4. Reducing agents","Disrupt hydrogen bonds and hydrophobic interactions."],
["5. Salt concentration","Binding of salt ions to ionizable groups decreases interaction between oppositely charged groups."],
["6. Heavy metal ions","May disrupt salt bridges and also bond with sulfhydryl groups."],
["7. Temperature changes","Weak interactions (hydrogen bonds) are disrupted."],
["8. Mechanical stress","Stirring and grinding disrupt the delicate balance of forces that maintain structure."]]}];

function stats(){let c=0,w=0;Object.values(S.qa).forEach(a=>{c+=a.c;w+=a.w});return{c,w,a:c+w,vw:Object.keys(S.vw).length,k:Object.values(S.fc).filter(x=>x=="k").length,r:Object.values(S.fc).filter(x=>x=="r").length}}
function dash(){let s=stats(),p=Math.round((s.vw/T.length+s.k/nCards)/2*100),wk=weak();
V.innerHTML=`<h2>Dashboard</h2><div class="grid">${[["Topics",T.length],["Concepts",nCon],["Quiz questions",Q.length],["Flashcards",nCards],["Progress",p+"%"],["Answered",s.a],["Correct",s.c],["Incorrect",s.w],["Topics reviewed",s.vw+"/"+T.length]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>${bar(p)}<p><button class="btn" onclick="go('topic',${Math.min(Object.keys(S.vw).length,T.length-1)})">Continue Studying</button><button class="btn" onclick="go('quiz')">Take a Quiz</button><button class="btn" onclick="go('fc')">Review Flashcards</button><button class="btn g" onclick="go('qr')">Quick Reference</button></p><div class="card"><h3>Weak topics</h3>${wk.length?wk.map(i=>`<span class="badge">${T[i].n}</span>`).join(""):"<span class='src'>None yet — take a quiz to find them.</span>"}</div><div class="card"><h3>Recently studied</h3>${(S.hist||[]).slice(-5).reverse().map(i=>`<a href="#" onclick="go('topic',${i});return false">${T[i].n}</a>`).join(" · ")||"<span class='src'>Nothing yet.</span>"}</div><div class="card src">${SRC}. All content comes only from this file.</div>`}
function body(ti){let t=T[ti];return`<div class="card" id="t${ti}"><h3>${t.n}</h3><div class="src">Source Section: ${t.s}</div><p>${t.d}</p>${t.i.map(x=>`<p><b>${x[0]}</b><br>${x[1]}</p>`).join("")}${tbl(t)}</div>`}
function full(){V.innerHTML="<h2>Full Reviewer</h2>"+T.map((_,i)=>body(i)).join("");T.forEach((_,i)=>S.vw[i]=1);sv()}
function topics(){V.innerHTML="<h2>Topics</h2>"+T.map((t,i)=>`<div class="card"><h3>${t.n}</h3><p>${t.d}</p><span class="badge">${t.i.length} concepts</span><span class="badge">${qc(i)} questions</span><span class="badge">${t.i.length} flashcards</span>${bar(tprog(i))}<p><button class="btn" onclick="go('topic',${i})">Open</button><button class="btn g" onclick="go('fc',${i})">Flashcards</button></p></div>`).join("")}
function topic(i){i=+i;S.vw[i]=1;S.hist=(S.hist||[]).filter(x=>x!=i).concat(i);sv();V.innerHTML=`<button class="btn g" onclick="go('topics')">← Topics</button>`+body(i)+`<button class="btn" onclick="go('expl')">Read Explanations</button><button class="btn" onclick="go('fc',${i})">Study Flashcards</button><button class="btn" onclick="startQ('t',${i},Math.min(5,qc(${i})))">Quiz this topic</button>`}
function expl(){V.innerHTML="<h2>Explanations</h2><p class='src'>Tap a card to expand.</p>"+T.map(t=>`<h3>${t.n}</h3>`+t.i.map(x=>`<details><summary>${x[0]}</summary><p><b>What it is / means:</b> ${x[1]}</p><p class="src">Source Section: ${t.s}</p></details>`).join("")).join("")}
function qr(){V.innerHTML="<h2>Quick Reference</h2>"+T.map(t=>`<h3>${t.n}</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${t.i.map(x=>`<div class="card" style="margin:0;font-size:13px"><mark>${x[0]}</mark><br>${x[1]}</div>`).join("")}</div>${tbl(t)}`).join("")}
/* flashcards */
function deck(){return cards().filter(c=>fs.g=="all"||c[0]==fs.g)}
function fc(){let d=deck(),c=d[fs.i%d.length],it=T[c[0]].i[c[1]],k=c[0]+"-"+c[1];
V.innerHTML=`<h2>Flashcards</h2><select onchange="fs={g:this.value,i:0,fl:0};fc()"><option value="all">All Flashcards</option>${T.map((t,i)=>`<option value="${i}" ${fs.g==i?"selected":""}>${t.n}</option>`).join("")}</select> <span class="badge">${fs.i%d.length+1}/${d.length}</span><span class="badge">${S.fc[k]=="k"?"Known":S.fc[k]=="r"?"Need review":"Unmarked"}</span><div class="card fc" onclick="fs.fl^=1;fc()">${fs.fl?it[1]:"What is / describe: <b>&nbsp;"+it[0]+"</b>"}</div><button class="btn g" onclick="fs.i=(fs.i-1+d.length)%d.length;fs.fl=0;fc()">Previous</button><button class="btn g" onclick="fs.i++;fs.fl=0;fc()">Next</button><button class="btn g" onclick="fs.sh=1;shuf()">Shuffle</button><button class="btn" onclick="mk('${k}','k')">Mark as Known</button><button class="btn" style="background:var(--no)" onclick="mk('${k}','r')">Need Review</button>`}
let SH=null;function shuf(){let d=deck();fs.i=Math.floor(Math.random()*d.length);fs.fl=0;fc()}
function mk(k,v){S.fc[k]=v;sv();fs.i++;fs.fl=0;fc()}
/* quiz */
function quiz(){if(qs)return qrun();V.innerHTML=`<h2>Quiz</h2><div class="card"><p>Mode <select id="qm"><option value="a">All Topics</option><option value="w">Weak Topics</option><option value="r">Random Quiz</option>${T.map((t,i)=>`<option value="t${i}">Topic: ${t.n}</option>`).join("")}</select></p><p>Questions <select id="qn"><option>5</option><option>10</option><option>20</option><option>30</option><option value="c">Custom</option></select> <input id="qc" type="number" min="1" max="${Q.length}" value="8" style="width:70px"></p><button class="btn" onclick="sq()">Start</button></div>`}
function sq(){let m=$("#qm").value,n=$("#qn").value;n=n=="c"?+$("#qc").value:+n;startQ(m[0]=="t"?"t":m,m[0]=="t"?+m.slice(1):0,n)}
function startQ(m,t,n){let p=Q.map((q,i)=>i);if(m=="t")p=p.filter(i=>Q[i][0]==t);if(m=="w"){let w=weak();p=p.filter(i=>w.includes(Q[i][0]));if(!p.length)p=Q.map((q,i)=>i)}
p.sort(()=>Math.random()-.5);qs={p:p.slice(0,Math.max(1,n)),i:0,r:[],d:0,sel:[]};cur="quiz";R()}
function qrun(){if(qs.i>=qs.p.length)return qend();let q=Q[qs.p[qs.i]],h=`<h2>Quiz</h2>${bar(qs.i/qs.p.length*100)}<div class="card"><span class="badge">${T[q[0]].n}</span><span class="badge">${DN[q[6]]}</span><span class="badge">${qs.i+1}/${qs.p.length}</span><h3>${q[2]}</h3>`;
if(q[1]=="id")h+=`<input type="text" id="ia" placeholder="Your answer" ${qs.d?"disabled":""}>`;
else h+=q[3].map((o,j)=>{let c="opt";if(qs.d){if(q[1]=="ma"?q[4].includes(j):q[4]==j)c+=" ok";else if(qs.sel.includes(j))c+=" no"}else if(qs.sel.includes(j))c+=" sel";return`<button class="${c}" onclick="pk(${j})">${o}</button>`}).join("");
if(qs.d)h+=`<p><b>${qs.ok?"Correct.":"Incorrect."}</b> ${q[5]}</p><button class="btn" onclick="qs.i++;qs.d=0;qs.sel=[];qrun()">Next</button>`;else h+=`<button class="btn" onclick="ck()">Check answer</button>`;V.innerHTML=h+"</div>"}
function pk(j){if(qs.d)return;let q=Q[qs.p[qs.i]];if(q[1]=="ma")qs.sel=qs.sel.includes(j)?qs.sel.filter(x=>x!=j):qs.sel.concat(j);else qs.sel=[j];qrun()}
function ck(){let q=Q[qs.p[qs.i]],ok;if(q[1]=="id"){let v=($("#ia").value||"").trim().toLowerCase();if(!v)return;ok=q[4].includes(v)}else{if(!qs.sel.length)return;ok=q[1]=="ma"?[...qs.sel].sort().join()==q[4].join():qs.sel[0]==q[4]}
qs.ok=ok;qs.d=1;qs.r.push([qs.p[qs.i],ok]);let a=S.qa[q[0]]||(S.qa[q[0]]={c:0,w:0});ok?a.c++:a.w++;if(!ok&&!S.wq.includes(qs.p[qs.i]))S.wq.push(qs.p[qs.i]);sv();qrun()}
function qend(){let c=qs.r.filter(x=>x[1]).length,n=qs.r.length,bad=qs.r.filter(x=>!x[1]),bt=[...new Set(bad.map(x=>Q[x[0]][0]))];S.hist2=(S.hist2||[]).concat(Math.round(c/n*100));sv();
V.innerHTML=`<h2>Results</h2><div class="card"><b style="font-size:24px">${c}/${n} (${Math.round(c/n*100)}%)</b><p>Correct: ${c} · Incorrect: ${n-c}</p><p>Topics needing improvement: ${bt.map(i=>`<span class="badge">${T[i].n}</span>`).join("")||"None"}</p></div>${bad.map(x=>`<div class="card"><b>${Q[x[0]][2]}</b><br>${Q[x[0]][1]=="id"?Q[x[0]][4][0]:[].concat(Q[x[0]][4]).map(j=>Q[x[0]][3][j]).join(", ")}<br><span class="src">${Q[x[0]][5]}</span></div>`).join("")}<button class="btn" onclick="qs=null;quiz()">New quiz</button><button class="btn g" onclick="go('qr')">Quick Reference</button>`}
function prog(){let s=stats();V.innerHTML=`<h2>Progress</h2><div class="card"><p>Topics viewed: ${s.vw}/${T.length}</p>${bar(s.vw/T.length*100)}<p>Flashcards known: ${s.k}/${nCards}</p>${bar(s.k/nCards*100)}<p>Marked need review: ${s.r}</p><p>Quiz accuracy: ${s.a?Math.round(s.c/s.a*100):0}% (${s.c} correct, ${s.w} incorrect)</p>${bar(s.a?s.c/s.a*100:0)}<p>Recent quiz scores: ${(S.hist2||[]).slice(-8).join("%, ")||"none"}${S.hist2&&S.hist2.length?"%":""}</p></div>${T.map((t,i)=>`<div class="card"><b>${t.n}</b> ${tprog(i)}%${bar(tprog(i))}</div>`).join("")}<button class="btn g" id="rb" onclick="resetP(this)">Reset progress</button>`}
function resetP(b){if(!b.dataset.c){b.dataset.c=1;b.textContent="Tap again to confirm reset";b.style.background="var(--no)";b.style.color="#fff";setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent="Reset progress";b.style.background="";b.style.color=""}},4000);return}
S={vw:{},qa:{},fc:{},wq:[],hist:[],hist2:[]};qs=null;fs={g:"all",i:0,fl:0};try{localStorage.removeItem("rv")}catch(e){}sv();prog()}
function srch(v){v=v.trim().toLowerCase();if(v.length<2){R();return}let h="",re=new RegExp("("+v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
T.forEach((t,ti)=>t.i.forEach(x=>{if((x[0]+x[1]).toLowerCase().includes(v))h+=`<div class="card"><span class="badge">Reviewer / Flashcard / Quick Ref</span><span class="badge">${t.n}</span><br><b>${x[0].replace(re,"<mark>$1</mark>")}</b><br>${x[1].replace(re,"<mark>$1</mark>")}</div>`}));
Q.forEach(q=>{if((q[2]+(q[3]||[]).join(" ")).toLowerCase().includes(v))h+=`<div class="card"><span class="badge">Quiz question</span><span class="badge">${T[q[0]].n}</span><br>${q[2].replace(re,"<mark>$1</mark>")}</div>`});
T.forEach(t=>{if(t.tb&&t.tb.r.toLowerCase().replace(/_/g," ").includes(v))h+=`<div class="card"><span class="badge">pKa/pI table</span> ${t.n}</div>`});V.innerHTML=`<h2>Search: ${v}</h2>`+(h||"<p>No results.</p>")}
go("dash");
</script></body></html>
